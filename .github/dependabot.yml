version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Group packages into shared PRs
    groups:
      dev:
        applies-to: 'version-updates'
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

      prod:
        applies-to: 'version-updates'
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

      security:
        applies-to: 'security-updates'
        patterns:
          - '*'

      other:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

    ignore:
      - dependency-name: 'eslint'
        versions: [">=10"]
      - dependency-name: "@types/node"
        versions: [">=25"] # Use Node LTS
      - dependency-name: "typescript"
        versions: [">=7"] # typescript-eslint peer-depends on typescript <6.1

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'

    cooldown:
      default-days: 7

    versioning-strategy: increase

    allow:
      # Include direct package.json updates
      - dependency-type: direct

  # Update docker packages
  - package-ecosystem: docker
    directory: /

    ignore:
      - dependency-name: "node"
        versions: [">=25"] # Use Node LTS
      - dependency-name: "mongo"
        versions: [">=7.1"] # CDP uses MongoDB 7.0

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'

    cooldown:
      default-days: 7

  # Update docker-compose packages
  - package-ecosystem: docker-compose
    directory: /

    ignore:
      - dependency-name: "node"
        versions: [">=25"] # Use Node LTS
      - dependency-name: "mongo"
        versions: [">=7.1"] # CDP uses MongoDB 7.0

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'

    cooldown:
      default-days: 7

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'

    cooldown:
      default-days: 7
